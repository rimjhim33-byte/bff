<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Boyfriend's Day</title>
    <!-- External CSS link -->
    <link rel="stylesheet" href="bff.css">
</head>
<body>

    <div class="container">
        <h1>Happy Boyfriend's Day ❤️</h1>

        <p class="message">
            To my favorite person ❤️
        </p>

        <p class="sub-message">
            You make every day special.
        </p>

        <button id="showButton">
            Open Your Surprise ❤️
        </button>

        <br><br>

        <img id="myPhoto" src="photo.jpg.jpg.png" alt="My Photo">

        <p id="loveMessage">
            You will always have a special place in my heart ❤️
        </p>
    </div>

    <!-- External JavaScript link -->
    <script src="bff.js"></script>
</body>
</html>
